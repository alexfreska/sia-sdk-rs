[package]
name = "indexd_node"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/alexfreska/sia-sdk-rs"
license = "MIT"
description = "NAPI SDK for interacting with a Sia network indexer from Node.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
indexd = { version = "0.2.0", path = "../indexd" }
napi = { version = "2", features = ["async", "napi9", "tokio_rt"] }
napi-derive = "2"
rand = "0.10.0"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sia_sdk = { version = "0.2.0", path = "../sia_sdk" }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7.18"

[build-dependencies]
napi-build = "2"
